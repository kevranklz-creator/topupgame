<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top-Up Game Store - Instan & Aman</title>
  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="font-sans antialiased">

  <!-- Navbar -->
  <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <a href="#" class="text-xl font-bold text-indigo-400 tracking-wide">🎮 GAMESTORE</a>
    <div class="space-x-4 text-sm">
      <a href="#" class="hover:text-indigo-400 transition">Beranda</a>
      <a href="#" class="hover:text-indigo-400 transition">Cek Transaksi</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Kolom 1: Informasi Game -->
      <div class="md:col-span-1 bg-slate-900 p-6 rounded-2xl border border-slate-800 h-fit">
        <div class="w-full h-40 bg-gradient-to-br from-indigo-600 to-purple-700 rounded-xl mb-4 flex items-center justify-center font-bold text-lg text-white shadow-inner">
          MOBILE LEGENDS
        </div>
        <h2 class="text-2xl font-bold mb-2">Mobile Legends</h2>
        <p class="text-sm text-slate-400 leading-relaxed">Top-up Diamond Mobile Legends resmi, murah, dan instan 24 jam. Cukup masukkan ID Anda, pilih nominal, dan bayar.</p>
      </div>

      <!-- Kolom 2 & 3: Formulir Top-Up -->
      <div class="md:col-span-2 space-y-6">
        
        <!-- Langkah 1: Input Akun -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <h3 class="text-lg font-semibold mb-4 text-indigo-400 flex items-center gap-2">
            <span class="flex items-center justify-center w-6 h-6 rounded-full bg-indigo-500/20 text-xs">1</span>
            Masukkan Data Akun
          </h3>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1">User ID</label>
              <input type="number" id="userId" placeholder="Contoh: 12345678" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Zone ID</label>
              <input type="number" id="zoneId" placeholder="Contoh: 1234" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
          </div>
        </div>

        <!-- Langkah 2: Nominal -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <h3 class="text-lg font-semibold mb-4 text-indigo-400 flex items-center gap-2">
            <span class="flex items-center justify-center w-6 h-6 rounded-full bg-indigo-500/20 text-xs">2</span>
            Pilih Nominal Top-Up
          </h3>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <button onclick="selectItem('86 Diamonds', 20000)" class="item-btn p-3 bg-slate-800 border border-slate-700 rounded-xl hover:border-indigo-500 text-left text-sm transition focus:border-indigo-500 focus:bg-indigo-950/30">
              <span class="block font-bold">86 Diamonds</span>
              <span class="text-xs text-slate-400">Rp 20.000</span>
            </button>
            <button onclick="selectItem('172 Diamonds', 40000)" class="item-btn p-3 bg-slate-800 border border-slate-700 rounded-xl hover:border-indigo-500 text-left text-sm transition focus:border-indigo-500 focus:bg-indigo-950/30">
              <span class="block font-bold">172 Diamonds</span>
              <span class="text-xs text-slate-400">Rp 40.000</span>
            </button>
            <button onclick="selectItem('257 Diamonds', 60000)" class="item-btn p-3 bg-slate-800 border border-slate-700 rounded-xl hover:border-indigo-500 text-left text-sm transition focus:border-indigo-500 focus:bg-indigo-950/30">
              <span class="block font-bold">257 Diamonds</span>
              <span class="text-xs text-slate-400">Rp 60.000</span>
            </button>
          </div>
        </div>

        <!-- Langkah 3: Metode Pembayaran -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <h3 class="text-lg font-semibold mb-4 text-indigo-400 flex items-center gap-2">
            <span class="flex items-center justify-center w-6 h-6 rounded-full bg-indigo-500/20 text-xs">3</span>
            Pilih Metode Pembayaran
          </h3>
          <div class="space-y-3">
            <!-- QRIS -->
            <label class="flex items-center justify-between p-3 bg-slate-800 border border-slate-700 rounded-xl cursor-pointer hover:border-indigo-500 transition">
              <div class="flex items-center gap-3">
                <input type="radio" name="payment" value="QRIS" class="text-indigo-600 focus:ring-indigo-500">
                <span class="text-sm font-semibold">QRIS (Otomatis)</span>
              </div>
              <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded">Instan</span>
            </label>
            <!-- E-Wallet -->
            <label class="flex items-center justify-between p-3 bg-slate-800 border border-slate-700 rounded-xl cursor-pointer hover:border-indigo-500 transition">
              <div class="flex items-center gap-3">
                <input type="radio" name="payment" value="DANA" class="text-indigo-600 focus:ring-indigo-500">
                <span class="text-sm font-semibold">DANA / OVO / GoPay</span>
              </div>
              <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded">Instan</span>
            </label>
            <!-- Virtual Account -->
            <label class="flex items-center justify-between p-3 bg-slate-800 border border-slate-700 rounded-xl cursor-pointer hover:border-indigo-500 transition">
              <div class="flex items-center gap-3">
                <input type="radio" name="payment" value="VA" class="text-indigo-600 focus:ring-indigo-500">
                <span class="text-sm font-semibold">Bank Virtual Account (BCA, Mandiri, BRI)</span>
              </div>
              <span class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded">1-5 Menit</span>
            </label>
          </div>
        </div>

        <!-- Tombol Beli -->
        <button onclick="processCheckout()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-lg shadow-indigo-600/20 cursor-pointer">
          Beli Sekarang
        </button>

      </div>
    </div>
  </main>

  <!-- JavaScript Logika & Simulasi API -->
  <script>
    let selectedItemName = '';
    let selectedItemPrice = 0;

    function selectItem(name, price) {
      selectedItemName = name;
      selectedItemPrice = price;
    }

    function processCheckout() {
      const userId = document.getElementById('userId').value;
      const zoneId = document.getElementById('zoneId').value;
      const paymentMethod = document.querySelector('input[name="payment"]:checked');

      if (!userId || !zoneId) {
        alert('Silakan masukkan User ID dan Zone ID Anda!');
        return;
      }
      if (!selectedItemName) {
        alert('Silakan pilih nominal top-up terlebih dahulu!');
        return;
      }
      if (!paymentMethod) {
        alert('Silakan pilih metode pembayaran Anda!');
        return;
      }

      const payload = {
        user_id: userId,
        zone_id: zoneId,
        product: selectedItemName,
        price: selectedItemPrice,
        payment: paymentMethod.value
      };

      console.log('Mengirim transaksi ke API Backend...', payload);
      alert(`Transaksi Berhasil Diproses!\n\nProduk: ${payload.product}\nTotal: Rp ${payload.price.toLocaleString('id-ID')}\nMetode: ${payload.payment}\n\nSilakan selesaikan pembayaran di halaman berikutnya.`);
    }
  </script>
</body>
</html>
